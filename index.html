<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就活管理アプリ</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f3;
    --bg3: #eeede9;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --radius: 8px;
    --radius-lg: 12px;
    --blue-bg: #e6f1fb;
    --blue-text: #185fa5;
    --blue-border: #85b7eb;
    --green-bg: #eaf3de;
    --green-text: #3b6d11;
    --amber-bg: #faeeda;
    --amber-text: #854f0b;
    --red-bg: #fcebeb;
    --red-text: #a32d2d;
    --red-border: #f09595;
    --warn-bg: #faeeda;
    --warn-text: #854f0b;
    --success-bg: #eaf3de;
    --success-text: #3b6d11;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1c;
      --bg2: #2a2a28;
      --bg3: #323230;
      --text: #f0eeea;
      --text2: #b4b2a9;
      --text3: #888780;
      --border: rgba(255,255,255,0.1);
      --border2: rgba(255,255,255,0.2);
      --blue-bg: #0c3a6a;
      --blue-text: #85b7eb;
      --blue-border: #185fa5;
      --green-bg: #1b3a0a;
      --green-text: #c0dd97;
      --amber-bg: #3d2505;
      --amber-text: #fac775;
      --red-bg: #3a1010;
      --red-text: #f09595;
      --red-border: #a32d2d;
      --warn-bg: #3d2505;
      --warn-text: #fac775;
      --success-bg: #1b3a0a;
      --success-text: #c0dd97;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
    background: var(--bg3);
    color: var(--text);
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin-bottom: 1.25rem;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .container { max-width: 700px; margin: 0 auto; }
  .stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  @media (max-width: 480px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--bg);
    border-radius: var(--radius);
    padding: 12px;
    text-align: center;
    border: 0.5px solid var(--border);
  }
  .stat-num { font-size: 26px; font-weight: 600; color: var(--text); }
  .stat-num.red { color: var(--red-text); }
  .stat-num.green { color: var(--success-text); }
  .stat-num.amber { color: var(--amber-text); }
  .stat-label { font-size: 11px; color: var(--text3); margin-top: 2px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 1rem; }
  .tab {
    padding: 7px 18px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: transparent;
    cursor: pointer;
    font-size: 14px;
    color: var(--text2);
    transition: all 0.15s;
    font-family: inherit;
  }
  .tab.active {
    background: var(--bg);
    color: var(--text);
    font-weight: 500;
    border-color: var(--border2);
  }
  .tab:hover:not(.active) { background: var(--bg2); }
  .section { display: none; }
  .section.active { display: block; }
  .sort-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 12px;
    flex-wrap: wrap;
  }
  .sort-row label { font-size: 13px; color: var(--text2); }
  .sort-row select {
    font-size: 13px;
    padding: 5px 8px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
  }
  .card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1rem 1.25rem;
    margin-bottom: 10px;
    transition: box-shadow 0.15s;
  }
  .card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 6px;
    flex-wrap: wrap;
  }
  .card-left { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .card-right { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .company { font-weight: 600; font-size: 15px; color: var(--text); }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: var(--radius);
    font-size: 12px;
    font-weight: 500;
  }
  .badge-es { background: var(--warn-bg); color: var(--warn-text); }
  .badge-intern { background: var(--blue-bg); color: var(--blue-text); }
  .badge-test { background: var(--red-bg); color: var(--red-text); }
  .badge-other { background: var(--bg2); color: var(--text2); }
  .st-badge { display: inline-block; padding: 2px 10px; border-radius: var(--radius); font-size: 12px; }
  .st-todo { background: var(--bg2); color: var(--text3); }
  .st-progress { background: var(--blue-bg); color: var(--blue-text); }
  .st-done { background: var(--success-bg); color: var(--success-text); }
  .st-passed { background: var(--red-bg); color: var(--red-text); }
  .date-row {
    font-size: 13px;
    color: var(--text2);
    margin-bottom: 3px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .note { font-size: 13px; color: var(--text3); margin-top: 2px; }
  .bar { height: 3px; border-radius: 2px; background: var(--bg3); margin-top: 10px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 2px; }
  .status-sel {
    font-size: 12px;
    padding: 3px 7px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    cursor: pointer;
  }
  .btn-del {
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 0.5px solid var(--red-border);
    background: transparent;
    color: var(--red-text);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  .btn-del:hover { background: var(--red-bg); }
  .btn-edit {
    padding: 4px 10px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
  }
  .btn-edit:hover { background: var(--bg2); }
  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--bg);
    border-radius: var(--radius-lg);
    padding: 1.5rem;
    width: 100%;
    max-width: 480px;
    border: 0.5px solid var(--border2);
    box-shadow: 0 8px 32px rgba(0,0,0,0.18);
    animation: modal-in 0.15s ease;
  }
  @keyframes modal-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .modal-title {
    font-size: 16px;
    font-weight: 600;
    margin-bottom: 1.1rem;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .modal-footer {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 1.25rem;
  }
  .btn-cancel {
    padding: 8px 18px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: transparent;
    color: var(--text2);
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
  }
  .btn-cancel:hover { background: var(--bg2); }
  .btn-save {
    padding: 8px 22px;
    border-radius: var(--radius);
    border: none;
    background: var(--blue-text);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
  }
  .btn-save:hover { opacity: 0.85; }
  .empty { text-align: center; padding: 2.5rem; color: var(--text3); font-size: 14px; }
  .form-card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
  }
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 140px; }
  .field label { font-size: 12px; color: var(--text2); font-weight: 500; }
  .field input, .field select {
    font-size: 14px;
    padding: 8px 10px;
    border-radius: var(--radius);
    border: 0.5px solid var(--border2);
    background: var(--bg);
    color: var(--text);
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  .field input:focus, .field select:focus { border-color: var(--blue-text); }
  .btn-add {
    padding: 9px 22px;
    border-radius: var(--radius);
    border: none;
    background: var(--blue-text);
    color: #fff;
    cursor: pointer;
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    transition: opacity 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .btn-add:hover { opacity: 0.85; }
  .urgent-tag { font-size: 12px; color: var(--red-text); font-weight: 500; }
  .warn-tag { font-size: 12px; color: var(--warn-text); font-weight: 500; }
  hr { border: none; border-top: 0.5px solid var(--border); margin: 10px 0; }
</style>
</head>
<body>
<div class="container">
  <h1><i class="ti ti-briefcase" aria-hidden="true"></i>就活管理アプリ</h1>
  <div class="stats" id="stats"></div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab('list')"><i class="ti ti-list" aria-hidden="true"></i> 一覧</button>
    <button class="tab" onclick="switchTab('add')"><i class="ti ti-plus" aria-hidden="true"></i> 追加</button>
  </div>

  <div class="section active" id="tab-list">
    <div class="sort-row">
      <label>並び替え：</label>
      <select onchange="sortItems(this.value)">
        <option value="date">日付順</option>
        <option value="company">会社名順</option>
        <option value="type">種類順</option>
        <option value="status">ステータス順</option>
      </select>
      <select onchange="filterItems(this.value)">
        <option value="all">すべて</option>
        <option value="es">ES締め切り</option>
        <option value="intern">インターン</option>
        <option value="test">筆記/WEBテスト</option>
        <option value="other">その他</option>
      </select>
    </div>
    <div id="item-list"></div>
  </div>

  <div class="section" id="tab-add">
    <div class="form-card">
      <div class="form-row">
        <div class="field">
          <label>会社名 *</label>
          <input type="text" id="inp-company" placeholder="例：〇〇株式会社">
        </div>
        <div class="field" style="max-width:170px;">
          <label>種類 *</label>
          <select id="inp-type">
            <option value="es">ES締め切り</option>
            <option value="intern">インターン</option>
            <option value="test">筆記/WEBテスト</option>
            <option value="other">その他</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="field">
          <label>日付 *</label>
          <input type="date" id="inp-date">
        </div>
        <div class="field" style="max-width:170px;">
          <label>ステータス</label>
          <select id="inp-status">
            <option value="todo">未着手</option>
            <option value="progress">対応中</option>
            <option value="done">完了</option>
            <option value="passed">期限切れ</option>
          </select>
        </div>
      </div>
      <div class="field" style="margin-bottom:16px;">
        <label>メモ</label>
        <input type="text" id="inp-note" placeholder="例：説明会参加済み、マイナビ経由など">
      </div>
      <button class="btn-add" onclick="addItem()">
        <i class="ti ti-plus" aria-hidden="true"></i> 追加する
      </button>
    </div>
  </div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <div class="modal-title"><i class="ti ti-edit" aria-hidden="true"></i>内容を編集</div>
    <input type="hidden" id="edit-id">
    <div class="form-row">
      <div class="field">
        <label>会社名 *</label>
        <input type="text" id="edit-company" placeholder="例：〇〇株式会社">
      </div>
      <div class="field" style="max-width:170px;">
        <label>種類 *</label>
        <select id="edit-type">
          <option value="es">ES締め切り</option>
          <option value="intern">インターン</option>
          <option value="test">筆記/WEBテスト</option>
          <option value="other">その他</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="field">
        <label>日付 *</label>
        <input type="date" id="edit-date">
      </div>
      <div class="field" style="max-width:170px;">
        <label>ステータス</label>
        <select id="edit-status">
          <option value="todo">未着手</option>
          <option value="progress">対応中</option>
          <option value="done">完了</option>
          <option value="passed">期限切れ</option>
        </select>
      </div>
    </div>
    <div class="field">
      <label>メモ</label>
      <input type="text" id="edit-note" placeholder="例：説明会参加済み、マイナビ経由など">
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">キャンセル</button>
      <button class="btn-save" onclick="saveEdit()"><i class="ti ti-check" aria-hidden="true"></i> 保存</button>
    </div>
  </div>
</div>

<script>
  const STORAGE_KEY = 'shukatu-items-v1';

  function getFutureDate(n) {
    const d = new Date(); d.setDate(d.getDate() + n);
    return d.toISOString().split('T')[0];
  }

  let items = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null') || [
    { id: 1, company: '〇〇商事', type: 'es', date: getFutureDate(5), status: 'progress', note: 'マイナビ経由' },
    { id: 2, company: '△△テクノロジー', type: 'intern', date: getFutureDate(12), status: 'todo', note: '1day インターン' },
    { id: 3, company: '□□銀行', type: 'test', date: getFutureDate(3), status: 'todo', note: 'SPI対策必要' },
  ];
  let nextId = Math.max(...items.map(i => i.id), 0) + 1;
  let currentFilter = 'all';
  let currentSort = 'date';

  const typeLabel = { es: 'ES締め切り', intern: 'インターン', test: '筆記/WEBテスト', other: 'その他' };
  const statusLabel = { todo: '未着手', progress: '対応中', done: '完了', passed: '期限切れ' };

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }

  function daysUntil(dateStr) {
    const today = new Date(); today.setHours(0,0,0,0);
    const d = new Date(dateStr); d.setHours(0,0,0,0);
    return Math.round((d - today) / 86400000);
  }

  function formatDate(dateStr) {
    const d = new Date(dateStr);
    const days = daysUntil(dateStr);
    const base = `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    if (days < 0) return `${base} <span class="urgent-tag">（${Math.abs(days)}日超過）</span>`;
    if (days === 0) return `${base} <span class="urgent-tag">（今日！）</span>`;
    if (days <= 3) return `${base} <span class="warn-tag">（あと${days}日）</span>`;
    return `${base} <span style="font-size:12px;color:var(--text3);">（あと${days}日）</span>`;
  }

  function barColor(days) {
    if (days < 0) return '#E24B4A';
    if (days <= 3) return '#EF9F27';
    if (days <= 7) return '#1D9E75';
    return '#378ADD';
  }

  function barWidth(days) {
    if (days < 0) return 100;
    if (days > 30) return 5;
    return Math.round((1 - days / 30) * 100);
  }

  function render() {
    let list = currentFilter === 'all' ? [...items] : items.filter(i => i.type === currentFilter);
    if (currentSort === 'date') list.sort((a,b) => a.date.localeCompare(b.date));
    else if (currentSort === 'company') list.sort((a,b) => a.company.localeCompare(b.company));
    else if (currentSort === 'type') list.sort((a,b) => a.type.localeCompare(b.type));
    else if (currentSort === 'status') list.sort((a,b) => a.status.localeCompare(b.status));

    const el = document.getElementById('item-list');
    if (list.length === 0) {
      el.innerHTML = '<div class="empty"><i class="ti ti-inbox" style="font-size:32px;display:block;margin-bottom:8px;" aria-hidden="true"></i>登録されたデータがありません</div>';
    } else {
      el.innerHTML = list.map(item => {
        const days = daysUntil(item.date);
        return `<div class="card">
          <div class="card-top">
            <div class="card-left">
              <span class="company">${escHtml(item.company)}</span>
              <span class="badge badge-${item.type}">${typeLabel[item.type]}</span>
              <span class="st-badge st-${item.status}">${statusLabel[item.status]}</span>
            </div>
            <div class="card-right">
              <select class="status-sel" onchange="changeStatus(${item.id}, this.value)">
                <option value="todo" ${item.status==='todo'?'selected':''}>未着手</option>
                <option value="progress" ${item.status==='progress'?'selected':''}>対応中</option>
                <option value="done" ${item.status==='done'?'selected':''}>完了</option>
                <option value="passed" ${item.status==='passed'?'selected':''}>期限切れ</option>
              </select>
              <button class="btn-edit" onclick="openEdit(${item.id})" aria-label="編集"><i class="ti ti-pencil" aria-hidden="true"></i></button>
              <button class="btn-del" onclick="deleteItem(${item.id})" aria-label="削除"><i class="ti ti-trash" aria-hidden="true"></i></button>
            </div>
          </div>
          <div class="date-row"><i class="ti ti-calendar" style="font-size:14px;" aria-hidden="true"></i>${formatDate(item.date)}</div>
          ${item.note ? `<div class="note"><i class="ti ti-notes" style="font-size:13px;vertical-align:-2px;margin-right:3px;" aria-hidden="true"></i>${escHtml(item.note)}</div>` : ''}
          <div class="bar"><div class="bar-fill" style="width:${barWidth(days)}%;background:${barColor(days)};"></div></div>
        </div>`;
      }).join('');
    }

    const total = items.length;
    const urgent = items.filter(i => { const d = daysUntil(i.date); return d >= 0 && d <= 7 && i.status !== 'done'; }).length;
    const done = items.filter(i => i.status === 'done').length;
    const es = items.filter(i => i.type === 'es').length;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><div class="stat-num">${total}</div><div class="stat-label">登録件数</div></div>
      <div class="stat"><div class="stat-num red">${urgent}</div><div class="stat-label">7日以内の期限</div></div>
      <div class="stat"><div class="stat-num green">${done}</div><div class="stat-label">完了</div></div>
      <div class="stat"><div class="stat-num amber">${es}</div><div class="stat-label">ES締め切り</div></div>
    `;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function switchTab(t) {
    document.querySelectorAll('.tab').forEach((el,i) => el.classList.toggle('active', ['list','add'][i] === t));
    document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
    document.getElementById('tab-'+t).classList.add('active');
  }

  function sortItems(v) { currentSort = v; render(); }
  function filterItems(v) { currentFilter = v; render(); }

  function addItem() {
    const company = document.getElementById('inp-company').value.trim();
    const type = document.getElementById('inp-type').value;
    const date = document.getElementById('inp-date').value;
    const status = document.getElementById('inp-status').value;
    const note = document.getElementById('inp-note').value.trim();
    if (!company || !date) { alert('会社名と日付は必須です'); return; }
    items.push({ id: nextId++, company, type, date, status, note });
    save();
    document.getElementById('inp-company').value = '';
    document.getElementById('inp-date').value = getFutureDate(7);
    document.getElementById('inp-note').value = '';
    render();
    switchTab('list');
  }

  function deleteItem(id) {
    if (!confirm('削除してよいですか？')) return;
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  function changeStatus(id, val) {
    const item = items.find(i => i.id === id);
    if (item) { item.status = val; save(); render(); }
  }

  function openEdit(id) {
    const item = items.find(i => i.id === id);
    if (!item) return;
    document.getElementById('edit-id').value = id;
    document.getElementById('edit-company').value = item.company;
    document.getElementById('edit-type').value = item.type;
    document.getElementById('edit-date').value = item.date;
    document.getElementById('edit-status').value = item.status;
    document.getElementById('edit-note').value = item.note || '';
    document.getElementById('modal-overlay').classList.add('open');
  }

  function closeModal() {
    document.getElementById('modal-overlay').classList.remove('open');
  }

  function closeModalOnOverlay(e) {
    if (e.target === document.getElementById('modal-overlay')) closeModal();
  }

  function saveEdit() {
    const id = parseInt(document.getElementById('edit-id').value);
    const company = document.getElementById('edit-company').value.trim();
    const date = document.getElementById('edit-date').value;
    if (!company || !date) { alert('会社名と日付は必須です'); return; }
    const item = items.find(i => i.id === id);
    if (item) {
      item.company = company;
      item.type    = document.getElementById('edit-type').value;
      item.date    = date;
      item.status  = document.getElementById('edit-status').value;
      item.note    = document.getElementById('edit-note').value.trim();
      save();
      render();
    }
    closeModal();
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  document.getElementById('inp-date').value = getFutureDate(7);
  render();
</body>
</html>
